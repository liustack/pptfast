# CI: `pnpm check` (typecheck + lint + test) on every PR and on main pushes.
# On main pushes, a second job also runs the full `pnpm e2e` chain.
#
# Version alignment:
# - package.json `engines` says node >=22.19, so the matrix runs the LTS line
#   that floor sits on (22) and the next one (24). Nothing below 22 is tested
#   because nothing below 22 is supported.
# - package.json has no `packageManager` field. The lockfile is
#   lockfileVersion 9.0 (pnpm 9/10 format) and the repo is developed with
#   pnpm 10, so pnpm is pinned to major 10 here. If a `packageManager` field
#   is added later, drop the explicit `version:` below — pnpm/action-setup
#   reads that field on its own.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # POSIX permission-bit tests (chmod 0600, X_OK, group/other-readable) use
    # skipIf(win32). Those skips are not product bugs: Windows has no POSIX
    # permission bits, so chmod 0600 assertions would mis-fire on windows-latest.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # Full end-to-end chain (build + CLI e2e + LibreOffice visual gate), main only —
  # it is slower than `pnpm check` and needs a LibreOffice install, so PRs stay
  # on the fast check job. Windows is check-only: soffice/LibreOffice is not
  # installed on windows-latest here.
  e2e:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # scripts/e2e.mts silently skips its LibreOffice PDF visual gate when
      # `soffice` is missing ("soffice unavailable — visual gate skipped").
      # A green run without soffice would therefore be quietly weaker than it
      # looks, so LibreOffice is installed explicitly here — apt on
      # ubuntu-latest handles it fine, no skip needed. If this install ever
      # becomes impossible on the runner image, remove this step and note here
      # that the visual gate is skipped in CI, do not let it pass silently.
      - name: Install LibreOffice (soffice) for the e2e visual gate
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-impress
      - run: pnpm install --frozen-lockfile
      - run: pnpm e2e
